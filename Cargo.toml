[workspace]
resolver = "2"

members = [
	"bb-flasher",
	"bb-imager-cli",
	"bb-flasher-pb2-mspm0",
	"bb-imager-gui",
	"bb-flasher-bcf",
	"bb-flasher-sd",
	"bb-downloader",
	"bb-config",
	"bb-helper",
	"bb-flasher-dfu",
        "bb-drivelist", 
        "bb-flasher-mspm0",
        "bb-bmap-parser",
        "bb-iced-widgets",
        "bb-os-list-generator",
        "bb-imager-gui-ui",
        "bb-imager-db",
]

# Shipped packages: opt in with `make ... CARGO_PROFILE=dist`. `release` keeps Rust's defaults so
# local release builds and PR artifacts stay fast.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true

[profile.profiling]
inherits = "dist"
debug = 1

[workspace.package]
version = "1.0.22"
edition = "2024"
authors = ["Ayush Singh <ayush@beagleboard.org>"]
repository = "https://github.com/beagleboard/bb-imager-rs"
license = "MIT"

[workspace.lints.clippy]
missing_const_for_fn = "warn"
