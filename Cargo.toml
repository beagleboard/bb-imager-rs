[workspace]
resolver = "2"

members = [
	"bb-flasher",
	"bb-imager-cli",
	"bb-flasher-pb2-mspm0",
	"bb-imager-gui",
	"bb-flasher-bcf",
	"bb-flasher-sd",
	"bb-downloader",
	"bb-config",
	"bb-helper",
	"bb-flasher-dfu",
        "bb-drivelist", 
        "bb-flasher-mspm0",
        "bb-bmap-parser",
        "bb-iced-widgets",
        "bb-destination-watcher"
]

[profile.release]
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 1

[workspace.package]
version = "1.0.14"
edition = "2024"
authors = ["Ayush Singh <ayush@beagleboard.org>"]
repository = "https://github.com/beagleboard/bb-imager-rs"
license = "MIT"
