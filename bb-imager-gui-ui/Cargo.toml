[package]
name = "bb-imager-gui-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
iced = { version = "0.14", default-features = false, features = ["image", "svg"] }
bb-iced-widgets = { path = "../bb-iced-widgets" }
chrono-tz = "0.10"
url = "2.5"
bb-config = { path = "../bb-config" }
bb-helper = { path = "../bb-helper", default-features = false, features = ["fmt"] }
iced_aw = { version = "0.14.1", default-features = false, features = ["spinner"] }

[dev-dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "x11", "wayland", "tokio"] }
tempfile = "3.27"
serde_json = "1.0.150"
bb-downloader = { path = "../bb-downloader" }

[features]
debug = ["iced/hot"]
pre-release = []

[lints]
workspace = true
