name: Run PR Tests

on:
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true
    - name: Install dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: make setup-debian-deps
    - name: Select rust toolchain
      run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
    - name: Use caching
      uses: Swatinem/rust-cache@v2
    - name: Run checks
      run: make check WERROR=1
    - name: Run tests
      run: make test WERROR=1

  semver-checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install dependencies
      run: make setup-debian-deps
    - name: Select rust toolchain
      run: rustup toolchain install stable --profile minimal
    - name: Use caching
      uses: Swatinem/rust-cache@v2
    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-semver-checks
    - name: Run semver checks
      run: make semver-checks

  release-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true
    - name: Install dependencies
      run: make setup-debian-deps
    - name: Select rust toolchain
      run: rustup toolchain install stable --profile minimal
    - name: Use caching
      uses: Swatinem/rust-cache@v2
    - name: Install cargo-release
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-release
    # Bump to a never-published version so workspace-versioned crates (bb-imager-cli)
    # get packaged against crates.io, exactly as release.yml does after a real bump.
    - name: Version bump
      env:
        GIT_AUTHOR_NAME: ci
        GIT_AUTHOR_EMAIL: ci@localhost
        GIT_COMMITTER_NAME: ci
        GIT_COMMITTER_EMAIL: ci@localhost
      run: |
        git checkout -b release-check
        yes | make version-bump VERSION=0.0.0-release-check
    - name: Dry-run release
      run: cargo release publish --workspace

  cargo-deny:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources

    # Do not break CI for advisories. This is useful since even if I create a PR to fix things 
    # upstream, it will take a while to get merged. In most cases, it is fine to wait.
    continue-on-error: ${{ matrix.checks == 'advisories' }}

    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check ${{ matrix.checks }}
