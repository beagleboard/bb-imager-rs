name: Create Armbian OS List

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - 'bb-os-list-generator/**'
      - 'bb-config/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/os_list.yml'
  # Build everyday
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build OS List File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use caching
        uses: Swatinem/rust-cache@v2

      - name: Generate OS List
        run: cargo run -p bb-os-list-generator

      - name: Pre-Release
        uses: softprops/action-gh-release@v3
        if: github.event_name != 'pull_request'
        with:
          prerelease: true
          name: Continuous Release
          tag_name: continuous-release
          files: bb-os-list-generator/dist/os_list.json
