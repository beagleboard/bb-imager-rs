[package]
name = "bb-helper"
version = "0.1.0"
description = "Small helper utilities shared across the BeagleBoard.org imaging tools"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["beagle", "cancellation", "progress", "stream"]
categories = ["asynchronous", "concurrency", "filesystem"]

[dependencies]
tempfile = { version = "3.27", optional = true }
tokio = { version = "1.52", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

[features]
file_stream = ["tokio/fs", "tokio/io-util", "dep:tempfile"]
reader_progress = []
cancel = []

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
